name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test & Verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff lint checks
        run: ruff check .

      - name: Run Mypy static type checks
        run: mypy truthgate api scripts

      - name: Run pytest suite with 90% coverage gate
        run: pytest -v --cov=truthgate --cov-report=term-missing --cov-fail-under=90

      - name: Run CLI & HTTP smoke checks
        run: |
          truthgate demo
          truthgate benchmark
          truthgate rules
          truthgate serve-http --help
          python scripts/smoke_test.py
