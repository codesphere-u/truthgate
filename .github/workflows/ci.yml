name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test & Verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" ruff mypy httpx fastapi

      - name: Run Ruff lint & Mypy type check
        run: |
          ruff check .
          mypy truthgate api

      - name: Run pytest suite with coverage gate
        run: pytest -v --cov=truthgate --cov-report=term-missing --cov-fail-under=85

      - name: Run end-to-end verification and repair demo
        run: truthgate demo

      - name: Run reproducible 40-scenario benchmark suite
        run: truthgate benchmark
