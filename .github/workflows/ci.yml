name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Runtime Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit runtime & server dependencies with pip-audit
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/python -m pip install --upgrade pip pip-audit
          .audit-venv/bin/pip install --no-cache-dir -e ".[server]"
          .audit-venv/bin/pip-audit --skip-editable --progress-spinner off

  docker-build:
    name: Docker Image Build & Non-Root Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t truthgate:ci .
      - name: Verify non-root container & package import
        run: docker run --rm truthgate:ci python -c "import os, truthgate; assert os.geteuid() != 0"

  test:
    name: Test & Verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff lint checks
        run: ruff check .

      - name: Run Mypy static type checks
        run: mypy truthgate api scripts

      - name: Run pytest suite with 90% coverage gate
        run: pytest -v --cov=truthgate --cov-report=term-missing --cov-fail-under=90

      - name: Run CLI & HTTP smoke checks
        run: |
          truthgate demo
          truthgate benchmark
          truthgate rules
          truthgate serve-http --help
          python scripts/smoke_test.py
